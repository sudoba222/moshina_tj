name: tajcar
description: "TAJCAR — Car marketplace for Tajikistan"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  go_router: ^13.2.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^2.4.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  image_picker: ^1.1.2
  share_plus: ^12.0.2

  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/splash_blank.png
    image_dark: assets/images/splash_blank.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
